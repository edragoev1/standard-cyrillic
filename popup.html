<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Standard Cyrillic</title>
<style>
  body {
    width: 280px;
    margin: 0;
    padding: 14px 16px;
    font: 14px/1.45 system-ui, sans-serif;
    color: #1d2433;
    background: #fff;
  }
  h1 {
    margin: 0 0 2px;
    font-size: 16px;
    font-weight: 600;
  }
  .sample {
    margin: 0 0 12px;
    color: #4a5263;
  }
  label {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    cursor: pointer;
  }
  input {
    margin: 3px 0 0;
  }
  .host {
    font-weight: 600;
    overflow-wrap: anywhere;
  }
  #status {
    margin: 10px 0 0;
    color: #4a5263;
    font-size: 13px;
  }
</style>
</head>
<body>
  <h1>Standard Cyrillic</h1>
  <p class="sample">т д г и п, as in print</p>
  <label><input type="checkbox" id="on"> <span>On for <span class="host" id="host">this site</span></span></label>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
